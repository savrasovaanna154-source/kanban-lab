name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Backend tests (Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: ./server
        run: npm ci

      - name: Run unit + integration tests with coverage
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban_test
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test
        run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage/

  client-build-and-e2e:
    name: Frontend E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: server-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server deps
        working-directory: ./server
        run: npm ci

      - name: Apply Prisma schema
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban
        run: npx prisma db push --skip-generate

      - name: Start backend
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: production
          PORT: 3000
        run: |
          npm run build
          nohup node dist/index.js > /tmp/server.log 2>&1 &
          sleep 3
          curl http://localhost:3000/health || (cat /tmp/server.log && exit 1)

      - name: Install client deps
        working-directory: ./client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./client
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: ./client
        run: |
          nohup npm run dev > /tmp/client.log 2>&1 &
          sleep 5
          curl http://localhost:5173 || (cat /tmp/client.log && exit 1)

      - name: Run E2E tests
        working-directory: ./client
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/

  security-audit:
    name: Security audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit server deps
        working-directory: ./server
        run: npm audit --audit-level=critical || true

      - name: Audit client deps
        working-directory: ./client
        run: npm audit --audit-level=critical || true